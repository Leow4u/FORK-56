# Work4You Apps connector broker — Composio session MCP proxy.
# Custom domain: connectors-api.work4you.ai → this app.
app = "work4you-connectors-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PORTAL_ISSUER = "https://portal.work4you.ai"
  PUBLIC_BASE_URL = "https://connectors-api.work4you.ai"
  COMPOSIO_API_BASE = "https://backend.composio.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
