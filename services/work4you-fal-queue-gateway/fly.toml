# Work4You FAL queue tool gateway — Hermes-style vendor passthrough.
# Custom domain: fal-queue-gateway.work4you.ai → this app.
# The agent already resolves this host via tools.managed_tool_gateway
# (vendor "fal-queue").
app = "work4you-fal-queue-gateway"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PORTAL_ISSUER = "https://portal.work4you.ai"
  PORTAL_BILLING_BASE_URL = "https://portal.work4you.ai"
  FAL_QUEUE_URL = "https://queue.fal.run"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
