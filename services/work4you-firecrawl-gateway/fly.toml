# Work4You Firecrawl tool gateway — Hermes-style vendor passthrough.
# Custom domain: firecrawl-gateway.work4you.ai → this app.
# The agent already resolves this host via tools.managed_tool_gateway
# (vendor "firecrawl").
app = "work4you-firecrawl-gateway"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PORTAL_ISSUER = "https://portal.work4you.ai"
  PORTAL_BILLING_BASE_URL = "https://portal.work4you.ai"
  FIRECRAWL_API_URL = "https://api.firecrawl.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
