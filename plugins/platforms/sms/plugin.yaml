name: sms-platform
label: SMS (Twilio)
kind: platform
version: 1.0.0
description: >
  SMS gateway adapter for Work4You via Twilio. Sends and receives SMS
  through the Twilio REST API + inbound webhook, relaying texts between phone
  numbers and the Work4You agent. Markdown is stripped to plain text.
author: Work4You
requires_env:
  - name: TWILIO_ACCOUNT_SID
    description: "Twilio Account SID"
    prompt: "Twilio Account SID"
    url: "https://www.twilio.com/"
    password: false
  - name: TWILIO_AUTH_TOKEN
    description: "Twilio Auth Token"
    prompt: "Twilio Auth Token"
    password: true
  - name: TWILIO_PHONE_NUMBER
    description: "Twilio phone number (SMS-capable, E.164 format)"
    prompt: "Twilio phone number"
    password: false
optional_env:
  # Required by the adapter to START (Twilio signature validation) unless
  # SMS_INSECURE_NO_SIGNATURE=true, but kept out of requires_env so the
  # insecure-dev escape hatch stays usable; the messaging catalog marks it
  # required for the setup UIs.
  - name: SMS_WEBHOOK_URL
    description: "Public webhook URL configured in the Twilio console (e.g. https://example.com/webhooks/twilio)"
    prompt: "Public webhook URL"
    password: false
  - name: SMS_ALLOWED_USERS
    description: "Comma-separated phone numbers allowed to talk to the bot (E.164)"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: SMS_HOME_CHANNEL
    description: "Default phone number for cron / notification delivery"
    prompt: "Home number"
    password: false
