# Golden image source for Work4You Cloud agent VMs.
# Per-tenant apps (`w4y-agent-*`) pull registry.fly.io/work4you-cloud-runtime:…
app = "work4you-cloud-runtime"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  WORK4YOU_DASHBOARD_PORT = "8080"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
