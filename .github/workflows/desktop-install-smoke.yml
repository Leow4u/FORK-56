name: Desktop install smoke

# Native, actual packaged Electron/backend measurements. Harness changes also
# exercise the latest signed release on PRs. No speed threshold: record install,
# first window and usable backend separately.
# Post-release inputs are the publishing run's immutable asset IDs/commit.
on:
  pull_request:
    paths:
      - .github/workflows/desktop-install-smoke.yml
      - scripts/ci/desktop-runtime-smoke.*
      - scripts/ci/desktop_install_smoke.py
      - scripts/ci/desktop-install-smoke.ps1
      - scripts/ci/desktop-install-smoke.sh
      - scripts/ci/resolve_install_smoke.py
      - scripts/ci/summarize-install-smoke.py
      - tests-js/desktop-runtime-smoke.test.ts
      - tests/ci/test_install_smoke.py
  workflow_dispatch:
    inputs:
      mode:
        description: Published signed release or unsigned build from this checkout
        type: choice
        options: [release, build]
        default: release
      platform:
        description: Native platforms to exercise
        type: choice
        options: [both, windows, macos]
        default: both
      tag:
        description: Initial desktop-v tag (empty resolves Latest once)
        type: string
        default: ""
      next_tag:
        description: Optional different app-owned desktop-v tag for install then replacement; empty tests reinstall
        type: string
        default: ""
  workflow_run:
    workflows: ["Release Desktop Installer"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-install-smoke-${{ github.event_name == 'workflow_run' && format('post-release-{0}', github.event.workflow_run.id) || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.params.outputs.mode }}
      tag: ${{ steps.params.outputs.tag }}
      commit: ${{ steps.params.outputs.commit }}
      run_windows: ${{ steps.params.outputs.run_windows }}
      run_macos: ${{ steps.params.outputs.run_macos }}
      windows_asset: ${{ steps.params.outputs.windows_asset }}
      windows_sha256: ${{ steps.params.outputs.windows_sha256 }}
      macos_asset: ${{ steps.params.outputs.macos_asset }}
      macos_sha256: ${{ steps.params.outputs.macos_sha256 }}
      next_commit: ${{ steps.params.outputs.next_commit }}
      next_windows_asset: ${{ steps.params.outputs.next_windows_asset }}
      next_windows_sha256: ${{ steps.params.outputs.next_windows_sha256 }}
      next_macos_asset: ${{ steps.params.outputs.next_macos_asset }}
      next_macos_sha256: ${{ steps.params.outputs.next_macos_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve pinned artifacts
        id: params
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SMOKE_MODE: ${{ inputs.mode || 'release' }}
          SMOKE_PLATFORM: ${{ inputs.platform || 'both' }}
          SMOKE_TAG: ${{ inputs.tag }}
          NEXT_TAG: ${{ inputs.next_tag }}
        run: |
          set -euo pipefail
          mkdir -p smoke-source
          if [ "$EVENT" = workflow_run ]; then
            published=0
            if [ "$SOURCE_CONCLUSION" = success ]; then
              published="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN/jobs" --jq '[.jobs[] | select(.name=="Publish desktop release" and .conclusion=="success")] | length')"
            fi
            if [ "$published" = 0 ]; then
              echo 'run_windows=false' >> "$GITHUB_OUTPUT"
              echo 'run_macos=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh run download "$SOURCE_RUN" --repo "$REPO" --name desktop-release-smoke --dir smoke-source
            python3 scripts/ci/resolve_install_smoke.py smoke-source/desktop-release-smoke.json --expected-commit "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          elif [ "$SMOKE_MODE" = release ]; then
            if [ -z "$SMOKE_TAG" ] || [ "$SMOKE_TAG" = latest ]; then
              SMOKE_TAG="$(gh api "repos/$REPO/releases/latest" --jq .tag_name)"
            fi
            [[ "$SMOKE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            commit="$(gh api "repos/$REPO/commits/$SMOKE_TAG" --jq .sha)"
            gh api "repos/$REPO/releases/tags/$SMOKE_TAG" | jq --arg commit "$commit" '. + {smokeCommit: $commit}' > smoke-source/desktop-release-smoke.json
            python3 scripts/ci/resolve_install_smoke.py smoke-source/desktop-release-smoke.json >> "$GITHUB_OUTPUT"
          else
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$NEXT_TAG" ]; then
            [[ "$NEXT_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            commit="$(gh api "repos/$REPO/commits/$NEXT_TAG" --jq .sha)"
            gh api "repos/$REPO/releases/tags/$NEXT_TAG" | jq --arg commit "$commit" '. + {smokeCommit: $commit}' > smoke-source/next-release-smoke.json
            python3 scripts/ci/resolve_install_smoke.py smoke-source/next-release-smoke.json --prefix next_ >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$SMOKE_MODE" >> "$GITHUB_OUTPUT"
          echo "run_windows=$([ "$SMOKE_PLATFORM" != macos ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_macos=$([ "$SMOKE_PLATFORM" != windows ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-install-smoke-inputs
          path: smoke-source/*.json
          if-no-files-found: ignore
          retention-days: 7

  windows-smoke:
    name: Windows install smoke
    needs: resolve
    if: needs.resolve.outputs.run_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: npm i -g npm@12
      - run: npm ci
      - name: Download exact selected assets
        if: needs.resolve.outputs.mode == 'release' || needs.resolve.outputs.next_windows_asset != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.resolve.outputs.windows_asset }}
          NEXT_ASSET: ${{ needs.resolve.outputs.next_windows_asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "$ASSET" ]; then gh api "repos/${{ github.repository }}/releases/assets/$ASSET" -H 'Accept: application/octet-stream' > dist/Work4You-Setup.exe; fi
          if [ -n "$NEXT_ASSET" ]; then gh api "repos/${{ github.repository }}/releases/assets/$NEXT_ASSET" -H 'Accept: application/octet-stream' > dist/Work4You-Next.exe; fi
      - name: Build unsigned Windows installer
        if: needs.resolve.outputs.mode == 'build'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-runtime.ps1 -OutDir apps/desktop/build/runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build failed' }
          Push-Location apps/desktop
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          npm run builder -- --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          Pop-Location
          $bundle = Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -ieq '.exe' -and $_.Name -match 'win' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $bundle) { throw 'NSIS installer not found' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bundle.FullName dist/Work4You-Setup.exe
      - name: Install and verify real packaged backend
        shell: pwsh
        env:
          SMOKE_MODE: ${{ needs.resolve.outputs.mode }}
          SMOKE_COMMIT: ${{ needs.resolve.outputs.commit }}
          SMOKE_SHA256: ${{ needs.resolve.outputs.windows_sha256 }}
          NEXT_COMMIT: ${{ needs.resolve.outputs.next_commit }}
          NEXT_SHA256: ${{ needs.resolve.outputs.next_windows_sha256 }}
        run: |
          $params = @{ InstallerPath='dist/Work4You-Setup.exe'; ExpectedCommit=$env:SMOKE_COMMIT; Sha256=$env:SMOKE_SHA256 }
          if ($env:SMOKE_MODE -eq 'release') { $params.RequireSigned = $true }
          if (Test-Path dist/Work4You-Next.exe) { $params.NextInstallerPath='dist/Work4You-Next.exe'; $params.NextCommit=$env:NEXT_COMMIT; $params.NextSha256=$env:NEXT_SHA256 }
          & scripts/ci/desktop-install-smoke.ps1 @params
          exit $LASTEXITCODE
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f install-smoke-windows.json ]; then python scripts/ci/summarize-install-smoke.py install-smoke-windows.json --markdown >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-install-smoke-windows
          path: install-smoke-windows.*
          if-no-files-found: warn
          retention-days: 7

  macos-smoke:
    name: macOS install smoke
    needs: resolve
    if: needs.resolve.outputs.run_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - run: npm i -g npm@12
      - run: npm ci
      - name: Download exact selected assets
        if: needs.resolve.outputs.mode == 'release' || needs.resolve.outputs.next_macos_asset != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.resolve.outputs.macos_asset }}
          NEXT_ASSET: ${{ needs.resolve.outputs.next_macos_asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "$ASSET" ]; then gh api "repos/${{ github.repository }}/releases/assets/$ASSET" -H 'Accept: application/octet-stream' > dist/Work4You.dmg; fi
          if [ -n "$NEXT_ASSET" ]; then gh api "repos/${{ github.repository }}/releases/assets/$NEXT_ASSET" -H 'Accept: application/octet-stream' > dist/Work4You-Next.dmg; fi
      - name: Build unsigned macOS installer
        if: needs.resolve.outputs.mode == 'build'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          bash scripts/build-desktop-runtime.sh --out-dir apps/desktop/build/runtime
          cd apps/desktop
          npm run build
          npm run builder -- --mac dmg --publish never
          cd ../..
          mkdir -p dist
          dmg="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' | head -n 1)"
          test -n "$dmg"
          cp "$dmg" dist/Work4You.dmg
      - name: Install and verify real packaged backend
        env:
          SMOKE_MODE: ${{ needs.resolve.outputs.mode }}
          SMOKE_COMMIT: ${{ needs.resolve.outputs.commit }}
          SMOKE_SHA256: ${{ needs.resolve.outputs.macos_sha256 }}
          NEXT_COMMIT: ${{ needs.resolve.outputs.next_commit }}
          NEXT_SHA256: ${{ needs.resolve.outputs.next_macos_sha256 }}
        run: |
          set -euo pipefail
          args=(--dmg dist/Work4You.dmg --commit "$SMOKE_COMMIT" --sha256 "$SMOKE_SHA256" --json-out install-smoke-macos.json --log-out install-smoke-macos.log)
          if [ "$SMOKE_MODE" = release ]; then args+=(--require-signed); fi
          if [ -f dist/Work4You-Next.dmg ]; then args+=(--next-dmg dist/Work4You-Next.dmg --next-commit "$NEXT_COMMIT" --next-sha256 "$NEXT_SHA256"); fi
          bash scripts/ci/desktop-install-smoke.sh "${args[@]}"
      - name: Summary
        if: always()
        run: |
          if [ -f install-smoke-macos.json ]; then python3 scripts/ci/summarize-install-smoke.py install-smoke-macos.json --markdown >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-install-smoke-macos
          path: install-smoke-macos.*
          if-no-files-found: warn
          retention-days: 7
