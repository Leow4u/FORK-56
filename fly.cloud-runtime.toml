# Work4You Cloud golden image — deploy from REPO ROOT (Windows-safe).
#
#   cd C:\DEV\FORK-56
#   fly deploy -c fly.cloud-runtime.toml -a work4you-cloud-runtime --local-only
#
# Do not deploy from services/work4you-cloud-agent on Windows: fly's
# build-context = "../.." can omit files from the Docker context (#29).
app = "work4you-cloud-runtime"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  build-context = "."

[env]
  WORK4YOU_DASHBOARD_HOST = "0.0.0.0"
  WORK4YOU_DASHBOARD_PORT = "8080"
  PORT = "8080"

[processes]
  app = "dashboard --host 0.0.0.0 --port 8080 --no-open"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
