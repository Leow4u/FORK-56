name: Sync NAS Cloud (Etapa 2)

# Pushes OAuth/bootstrap + golden-image pin to work4you-account-service.
#
# Triggers:
#   - After golden image deploy (fly-cloud-runtime.yml)
#   - Push to main when cloud/nas-sync/** changes
#   - Manual: Actions → Run workflow
#
# One-time setup (única vez):
#   gh secret set NAS_REPO_TOKEN --repo Leow4u/FORK-56
#   (fine-grained PAT: Contents read+write on Leow4u/work4you-account-service)

on:
  workflow_dispatch:
    inputs:
      agent_image:
        description: Optional full image ref to pin (defaults to cloud/nas-sync default)
        type: string
        required: false
  workflow_call:
    inputs:
      agent_image:
        description: Full registry.fly.io/... image tag from golden deploy
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - cloud/nas-sync/**
      - .github/workflows/sync-nas-cloud-etapa2.yml

permissions:
  contents: read

jobs:
  sync:
    name: Push NAS OAuth + golden image pin
    if: github.repository == 'Leow4u/FORK-56'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout FORK-56 (source files)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Require NAS_REPO_TOKEN
        id: token
        env:
          NAS_REPO_TOKEN: ${{ secrets.NAS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NAS_REPO_TOKEN}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::NAS_REPO_TOKEN not set — skipping NAS sync. Run once: gh secret set NAS_REPO_TOKEN --repo Leow4u/FORK-56"
            exit 0
          fi
          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout work4you-account-service
        if: steps.token.outputs.configured == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Leow4u/work4you-account-service
          token: ${{ secrets.NAS_REPO_TOKEN }}
          path: nas

      - name: Sync NAS cloud files
        if: steps.token.outputs.configured == 'true'
        env:
          AGENT_IMAGE: ${{ inputs.agent_image || github.event.inputs.agent_image || '' }}
        run: |
          set -euo pipefail
          # Sync fly-machines.ts when the pin must change OR when the file's
          # API/content drifted (e.g. new helpers that agents.ts imports).
          # Do NOT rely on `git diff before..sha` alone — default checkout is
          # shallow and that diff often no-ops under `if`, leaving NAS with a
          # stale fly-machines while agents.ts already imports new symbols
          # (broke Vercel: imagesMatch / rollMachineImage missing).
          #
          # Portal-only pushes must not overwrite a newer NAS pin with a stale
          # fork default — after a content sync we re-apply NAS_PIN when the
          # fork pin was unchanged-by-intent (same as pre-sync NAS) wait:
          # Prefer: content-normalize compare; on sync without AGENT_IMAGE,
          # keep the newer of FORK_PIN/NAS_PIN by keeping NAS pin whenever
          # FORK_PIN == old NAS was already equal... Actually:
          # - AGENT_IMAGE → explicit pin
          # - content drift → copy fork file, then if NAS_PIN set and no
          #   AGENT_IMAGE and FORK_PIN != NAS_PIN, restore NAS_PIN (pin wins
          #   from NAS; API wins from fork). Intentional fork pin bumps set
          #   FORK_PIN != NAS_PIN AND are usually paired with golden deploy
          #   passing AGENT_IMAGE. Manual workflow_dispatch syncs fork pin.
          SYNC_FLY_MACHINES=0
          if [ -n "${AGENT_IMAGE}" ]; then
            SYNC_FLY_MACHINES=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYNC_FLY_MACHINES=1
          fi
          FORK_PIN="$(grep -oE 'deployment-[A-Z0-9]+' cloud/nas-sync/src/lib/fly-machines.ts | head -1 || true)"
          NAS_PIN="$(grep -oE 'deployment-[A-Z0-9]+' nas/src/lib/fly-machines.ts | head -1 || true)"
          if [ -n "${FORK_PIN}" ] && [ -n "${NAS_PIN}" ] && [ "${FORK_PIN}" != "${NAS_PIN}" ]; then
            echo "Fork/NAS pin drift (fork=${FORK_PIN}, nas=${NAS_PIN}) — syncing fly-machines.ts"
            SYNC_FLY_MACHINES=1
          fi
          # Content drift ignoring the pin string (API / helpers / comments).
          normalize_fly() {
            sed -E 's/deployment-[A-Z0-9]+/deployment-PIN/g' "$1"
          }
          if ! cmp -s \
            <(normalize_fly cloud/nas-sync/src/lib/fly-machines.ts) \
            <(normalize_fly nas/src/lib/fly-machines.ts); then
            echo "fly-machines.ts content drift (ignoring pin) — syncing"
            SYNC_FLY_MACHINES=1
          fi
          # Shallow-safe path check (best-effort; never blocks content compare).
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
              | grep -qx 'cloud/nas-sync/src/lib/fly-machines.ts'; then
              SYNC_FLY_MACHINES=1
            fi
          fi

          cp cloud/nas-sync/src/lib/agents.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/agent-bootstrap.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/agent-gateway-drain.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/agent-redirect-uri.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/self-hosted-dashboard.ts nas/src/lib/
          if [ "${SYNC_FLY_MACHINES}" = 1 ]; then
            cp cloud/nas-sync/src/lib/fly-machines.ts nas/src/lib/
            if [ -n "${AGENT_IMAGE}" ]; then
              echo "Pinning agent image: ${AGENT_IMAGE}"
              sed -i "s|'registry\\.fly\\.io/work4you-cloud-runtime:deployment-[A-Z0-9]*'|'${AGENT_IMAGE}'|g" nas/src/lib/fly-machines.ts
            elif [ -n "${NAS_PIN}" ] && [ -n "${FORK_PIN}" ] && [ "${FORK_PIN}" != "${NAS_PIN}" ] \
              && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              # Content/API sync must not clobber a newer NAS-only pin.
              echo "Preserving NAS pin ${NAS_PIN} (fork had ${FORK_PIN})"
              sed -i "s|'registry\\.fly\\.io/work4you-cloud-runtime:deployment-[A-Z0-9]*'|'registry.fly.io/work4you-cloud-runtime:${NAS_PIN}'|g" nas/src/lib/fly-machines.ts
            else
              echo "Syncing fly-machines.ts (fork default pin)"
            fi
          else
            echo "Skipping fly-machines.ts (portal-only sync — NAS pin unchanged)"
          fi
          echo "sync_fly_machines=${SYNC_FLY_MACHINES}" >> "${GITHUB_ENV}"
          cp cloud/nas-sync/src/lib/inference-catalog.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/model-access.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/account-delete.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/tiers.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/org-billing.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/billing-client.ts nas/src/lib/
          cp cloud/nas-sync/src/lib/stripe-customer.ts nas/src/lib/
          mkdir -p nas/src/app/api/internal/billing/authorize
          cp cloud/nas-sync/src/app/api/internal/billing/authorize/route.ts nas/src/app/api/internal/billing/authorize/
          cp cloud/nas-sync/src/app/api/agents/route.ts nas/src/app/api/agents/
          mkdir -p nas/src/app/api/agents/\[id\]/\[action\]
          cp cloud/nas-sync/src/app/api/agents/\[id\]/route.ts nas/src/app/api/agents/\[id\]/
          cp cloud/nas-sync/src/app/api/agents/\[id\]/\[action\]/route.ts nas/src/app/api/agents/\[id\]/\[action\]/
          cp cloud/nas-sync/src/app/api/keys/models/route.ts nas/src/app/api/keys/models/
          cp cloud/nas-sync/src/app/api/work4you/recommended-models/route.ts nas/src/app/api/work4you/recommended-models/
          mkdir -p nas/src/app/api/oauth/self-hosted-client/\[id\]
          cp cloud/nas-sync/src/app/api/oauth/self-hosted-client/route.ts nas/src/app/api/oauth/self-hosted-client/
          cp cloud/nas-sync/src/app/api/oauth/self-hosted-client/\[id\]/route.ts nas/src/app/api/oauth/self-hosted-client/\[id\]/
          mkdir -p nas/src/app/api/account
          cp cloud/nas-sync/src/app/api/account/route.ts nas/src/app/api/account/
          cp cloud/nas-sync/src/portal/pages/org/CloudPage.tsx nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/LocalDashboardsPage.tsx nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/LocalDashboardsPage.module.css nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/AccountSettingsPage.tsx nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/AccountSettingsPage.module.css nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/BillingPage.tsx nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/ManageSubscriptionPage.tsx nas/src/portal/pages/
          mkdir -p nas/src/portal/components
          cp cloud/nas-sync/src/portal/components/PortalShell.tsx nas/src/portal/components/
          mkdir -p nas/src/portal/lib
          cp cloud/nas-sync/src/portal/lib/linked-accounts.ts nas/src/portal/lib/
          cp cloud/nas-sync/src/portal/lib/info-content.ts nas/src/portal/lib/
          cp cloud/nas-sync/src/portal/pages/org/InfoPage.tsx nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/InfoPage.module.css nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/CloudPage.module.css nas/src/portal/pages/org/
          cp cloud/nas-sync/src/portal/pages/org/ApiKeysPage.module.css nas/src/portal/pages/org/
          mkdir -p nas/src/portal/styles nas/src/portal/components
          cp cloud/nas-sync/src/portal/styles/global.css nas/src/portal/styles/
          cp cloud/nas-sync/src/portal/components/OrgPage.module.css nas/src/portal/components/

      - name: Commit and push to NAS main
        if: steps.token.outputs.configured == 'true'
        working-directory: nas
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/agents.ts \
            src/lib/agent-bootstrap.ts \
            src/lib/agent-gateway-drain.ts \
            src/lib/agent-redirect-uri.ts \
            src/lib/self-hosted-dashboard.ts \
            src/lib/inference-catalog.ts \
            src/lib/model-access.ts \
            src/lib/account-delete.ts \
            src/lib/tiers.ts \
            src/lib/org-billing.ts \
            src/lib/billing-client.ts \
            src/lib/stripe-customer.ts \
            src/app/api/internal/billing/authorize/route.ts \
            src/app/api/agents/route.ts \
            src/app/api/agents/\[id\]/route.ts \
            src/app/api/agents/\[id\]/\[action\]/route.ts \
            src/app/api/keys/models/route.ts \
            src/app/api/work4you/recommended-models/route.ts \
            src/app/api/oauth/self-hosted-client/route.ts \
            src/app/api/oauth/self-hosted-client/\[id\]/route.ts \
            src/app/api/account/route.ts \
            src/portal/pages/org/CloudPage.tsx \
            src/portal/pages/org/LocalDashboardsPage.tsx \
            src/portal/pages/org/LocalDashboardsPage.module.css \
            src/portal/pages/org/AccountSettingsPage.tsx \
            src/portal/pages/org/AccountSettingsPage.module.css \
            src/portal/pages/org/BillingPage.tsx \
            src/portal/pages/ManageSubscriptionPage.tsx \
            src/portal/components/PortalShell.tsx \
            src/portal/lib/linked-accounts.ts \
            src/portal/lib/info-content.ts \
            src/portal/pages/org/InfoPage.tsx \
            src/portal/pages/org/InfoPage.module.css \
            src/portal/pages/org/CloudPage.module.css \
            src/portal/pages/org/ApiKeysPage.module.css \
            src/portal/styles/global.css \
            src/portal/components/OrgPage.module.css
          if [ "${{ env.sync_fly_machines }}" = "1" ]; then
            git add src/lib/fly-machines.ts
          fi
          if git diff --staged --quiet; then
            echo "NAS already up to date — nothing to push."
            exit 0
          fi
          git commit -m "feat(cloud): sync from FORK-56"
          git push origin main

      - name: Summary
        if: success()
        run: |
          {
            if [ "${{ steps.token.outputs.configured }}" != "true" ]; then
              echo "## NAS sync skipped"
              echo ""
              echo "Add secret \`NAS_REPO_TOKEN\` once, then re-run deploy or push to \`cloud/nas-sync/\`."
            else
              echo "## NAS Etapa 2 synced"
              echo ""
              echo "Vercel redeploys portal.work4you.ai automatically."
              echo ""
              echo "Next: Portal → Cloud → **Atualizar** on an existing agent (preserves /opt/data history), or create a new one."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
