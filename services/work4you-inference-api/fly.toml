# Work4You inference gateway — Hermes-style OpenAI-compatible front for Portal.
# Custom domain: inference-api.work4you.ai → this app.
app = "work4you-inference-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PORTAL_ISSUER = "https://portal.work4you.ai"
  PORTAL_BILLING_BASE_URL = "https://portal.work4you.ai"
  OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
