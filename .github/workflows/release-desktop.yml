name: Release Desktop Installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build bootstrap installer (Windows)
        working-directory: apps/bootstrap-installer
        run: npm run tauri:build

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Recurse -Path apps/bootstrap-installer/src-tauri/target/release/bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $bundle) {
            $bundle = Get-ChildItem -Recurse -Path apps/bootstrap-installer/src-tauri/target/release/bundle -Filter 'Work4You-Setup.exe' | Select-Object -First 1
          }
          if (-not $bundle) { throw "Windows installer not found under bundle/" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bundle.FullName dist/Work4You-Setup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: dist/Work4You-Setup.exe
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build macOS installer
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - name: Build bootstrap installer (macOS)
        working-directory: apps/bootstrap-installer
        run: npm run tauri:build

      - name: Stage macOS artifact
        run: |
          set -euo pipefail
          dmg="$(find apps/bootstrap-installer/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::macOS DMG not found under bundle/dmg"
            exit 1
          fi
          mkdir -p dist
          cp "$dmg" dist/Work4You.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-installer
          path: dist/Work4You.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Publish desktop release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node -p "require('./apps/bootstrap-installer/package.json').version")"
          echo "tag=desktop-v${version}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release $tag"
          else
            gh release create "$tag" \
              --title "Work4You Desktop ${tag#desktop-v}" \
              --notes "Signed bootstrap installer for Windows and macOS. Downloads from [work4you.ai](https://work4you.ai/) redirect here."
          fi
          gh release upload "$tag" installers/windows-installer/Work4You-Setup.exe --clobber
          gh release upload "$tag" installers/macos-installer/Work4You.dmg --clobber
