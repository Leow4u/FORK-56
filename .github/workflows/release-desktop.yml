name: Release Desktop Installer

# Windows Authenticode: SSL.com eSigner (cloud; private key never leaves SSL.com).
# Required repo secrets after activating eSigner on the WORK4YOU code-signing order:
#   ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID, ESIGNER_TOTP_SECRET
# Script: scripts/ci/sign_windows_esigner.py

on:
  workflow_dispatch:
    inputs:
      skip_windows_signing:
        description: Skip Authenticode (Actions artifacts only; does not publish a GitHub Release)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      windows_signed: ${{ steps.sign.outcome == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      # apps/desktop `dist:win:nsis` (`npm run build && npm run builder -- --win nsis`).
      # `--publish never` is the same flag `npm run pack` already uses so
      # electron-builder 26 does not infer onTagOrDraft from CI + GITHUB_TOKEN
      # (#87758) and race the signed Work4You-Setup.exe upload below.
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npm run builder -- --win nsis --publish never

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $release = 'apps/desktop/release'
          if (-not (Test-Path $release)) {
            throw 'apps/desktop/release not found'
          }
          # Same filename filter as apps/desktop/scripts/test-desktop.mjs resolveNsisPath().
          $bundle = Get-ChildItem -Path $release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ieq '.exe' -and $_.Name -match 'win' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $bundle) {
            Write-Host 'release tree:'
            Get-ChildItem -Recurse $release | Select-Object -ExpandProperty FullName
            throw 'Windows NSIS installer not found under apps/desktop/release'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bundle.FullName dist/Work4You-Setup.exe

      - name: Warn unsigned Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_windows_signing == true }}
        run: echo "::warning::Work4You-Setup.exe is UNSIGNED. Do not ship this artifact."

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        with:
          python-version: "3.11"

      - name: Sign Windows installer (SSL.com eSigner)
        id: sign
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        # cmd, not pwsh 7: the default windows-latest shell injects
        # PSModulePath with PowerShell\7\Modules, which breaks 5.1's
        # Authenticode probe (TypeData / Microsoft.PowerShell.Security).
        shell: cmd
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: python scripts/ci/sign_windows_esigner.py dist/Work4You-Setup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_windows_signing == true && 'windows-installer-unsigned' || 'windows-installer' }}
          path: dist/Work4You-Setup.exe
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build macOS installer
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      # apps/desktop `dist:mac:dmg` (`npm run build && npm run builder -- --mac dmg`).
      # `--publish never` is the same flag `npm run pack` already uses so
      # electron-builder 26 does not infer onTagOrDraft from CI + GITHUB_TOKEN
      # (#87758) and race the Work4You.dmg upload below.
      # APPLE_* / CSC_* are the existing notarize.mjs / electron-builder inputs;
      # notarize.mjs skips when they are unset.
      - name: Build macOS DMG installer
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
        run: npm run build && npm run builder -- --mac dmg --publish never

      - name: Stage macOS artifact
        run: |
          set -euo pipefail
          release='apps/desktop/release'
          if [ ! -d "$release" ]; then
            echo "::error::apps/desktop/release not found"
            exit 1
          fi
          # Same idea as apps/desktop/scripts/test-desktop.mjs resolveDmgPath().
          dmg="$(ls -t "$release"/Work4You-*.dmg 2>/dev/null | head -n 1 || true)"
          if [ -z "$dmg" ]; then
            echo "::error::macOS DMG not found under apps/desktop/release"
            find "$release" -print
            exit 1
          fi
          mkdir -p dist
          cp "$dmg" dist/Work4You.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-installer
          path: dist/Work4You.dmg
          if-no-files-found: error

  publish:
    # Never publish when Windows signing was skipped or the sign step did not
    # succeed. Unsigned Work4You-Setup.exe must not clobber desktop-v* assets.
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v') || github.event_name == 'workflow_dispatch') && needs.build-windows.outputs.windows_signed == 'true'
    name: Publish desktop release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(node -p "require('./apps/bootstrap-installer/package.json').version")"
          echo "tag=desktop-v${version}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Updating existing release $tag"
          else
            gh release create "$tag" \
              --title "Work4You Desktop ${tag#desktop-v}" \
              --notes "Signed Windows NSIS app (npm run dist:win:nsis) and macOS DMG (npm run dist:mac:dmg). Downloads from [work4you.ai](https://work4you.ai/) redirect here."
          fi
          gh release upload "$tag" installers/windows-installer/Work4You-Setup.exe --clobber
          gh release upload "$tag" installers/macos-installer/Work4You.dmg --clobber
