name: Release Desktop Installer

# Windows Authenticode: SSL.com eSigner (cloud; private key never leaves SSL.com).
# Required repo secrets after activating eSigner on the WORK4YOU code-signing order:
#   ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID, ESIGNER_TOTP_SECRET
# Script: scripts/ci/sign_windows_esigner.py
#
# macOS Developer ID + notarization (electron-builder signs the .app; CI skips
# afterSign notary and this workflow notarizes the DMG). Required repo secrets:
#   CSC_P12_BASE64, CSC_KEY_PASSWORD,
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
# Script: scripts/ci/prepare_macos_signing.py
# Never put CSC_LINK in the build `env:` block. GitHub injects missing secrets
# as empty strings; electron-builder then treats CSC_LINK as a cert path and
# fails with "apps/desktop not a file" (desktop-v0.0.5 run 33462742230).
# Do not write CSC_LINK to GITHUB_ENV either: electron-builder 26 then builds
# a temp keychain and fails set-key-partition-list / SecKeychainUnlock on
# macos-26 (Release Desktop run 35235301249). Prepare imports the .p12 into
# a CI keychain and writes CSC_NAME / CSC_KEYCHAIN instead.
#
# Public .exe/.dmg live on GitHub releases/latest (desktop-v* series).
# workflow_dispatch must NOT read apps/bootstrap-installer/package.json —
# that is the Tauri setup wizard (0.0.3) and used to clobber desktop-v0.0.3
# while Latest (0.0.8+) stayed stale. Tag resolution is
# scripts/ci/resolve_desktop_release_tag.py.
#
# Build 2026-09-07: ship Teams (#227) and WhatsApp Cloud API (#228) in the
# signed desktop installers (.exe / .dmg).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Installer GitHub tag. Empty bumps the current desktop-v* Latest
          (new public .exe/.dmg). Use "latest" to rebuild Latest in place,
          or desktop-vX.Y.Z / X.Y.Z for an explicit tag. Do not use the
          bootstrap-installer package version.
        type: string
        required: false
        default: ""
      skip_windows_signing:
        description: Skip Authenticode (Actions artifacts only; does not publish a GitHub Release)
        type: boolean
        default: false
      skip_macos_signing:
        description: Skip Developer ID + notarization (Actions artifacts only; does not publish a GitHub Release)
        type: boolean
        default: false
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-desktop.yml
      - scripts/ci/prepare_macos_signing.py
      - scripts/ci/publish_desktop_release.py
      - scripts/ci/resolve_desktop_release_tag.py
      - apps/desktop/**
      - apps/shared/**
      - scripts/build-desktop-runtime.ps1
      - scripts/build-desktop-runtime.sh
      - scripts/deploy-desktop-runtime.ps1
      - scripts/deploy-desktop-runtime.sh

permissions:
  contents: write

# One publisher at a time so a dispatch cannot race a desktop-v* tag build
# (those used to use different github.ref values and clobber each other).
concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 150
    outputs:
      windows_signed: ${{ steps.sign.outcome == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      # Cursor-model payload: CPython + venv + allowlist + Node + rg, relocated
      # and probed before electron-builder copies it into extraResources.
      - name: Build prebuilt Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-runtime.ps1 `
            -OutDir apps/desktop/build/runtime `
            -ZipOut (Join-Path (Get-Location) "dist\runtime-win-x64.zip")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-runtime
          path: dist/runtime-win-x64.zip
          if-no-files-found: error

      # apps/desktop `dist:win:nsis` (`npm run build && npm run builder -- --win nsis`).
      # `--publish never` is the same flag `npm run pack` already uses so
      # electron-builder 26 does not infer onTagOrDraft from CI + GITHUB_TOKEN
      # (#87758) and race the signed Work4You-Setup.exe upload below.
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npm run builder -- --win nsis --publish never

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $release = 'apps/desktop/release'
          if (-not (Test-Path $release)) {
            throw 'apps/desktop/release not found'
          }
          # Same filename filter as apps/desktop/scripts/test-desktop.mjs resolveNsisPath().
          $bundle = Get-ChildItem -Path $release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -ieq '.exe' -and $_.Name -match 'win' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $bundle) {
            Write-Host 'release tree:'
            Get-ChildItem -Recurse $release | Select-Object -ExpandProperty FullName
            throw 'Windows NSIS installer not found under apps/desktop/release'
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $bundle.FullName dist/Work4You-Setup.exe

      - name: Warn unsigned Windows installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_windows_signing == true }}
        run: echo "::warning::Work4You-Setup.exe is UNSIGNED. Do not ship this artifact."

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        with:
          python-version: "3.11"

      - name: Sign Windows installer (SSL.com eSigner)
        id: sign
        if: ${{ github.event_name == 'release' || inputs.skip_windows_signing != true }}
        # cmd, not pwsh 7: the default windows-latest shell injects
        # PSModulePath with PowerShell\7\Modules, which breaks 5.1's
        # Authenticode probe (TypeData / Microsoft.PowerShell.Security).
        shell: cmd
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: python scripts/ci/sign_windows_esigner.py dist/Work4You-Setup.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_windows_signing == true && 'windows-installer-unsigned' || 'windows-installer' }}
          path: dist/Work4You-Setup.exe
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.release.tag_name, 'desktop-v')
    name: Build macOS installer
    runs-on: macos-latest
    timeout-minutes: 150
    outputs:
      macos_signed: ${{ steps.verify_macos.outcome == 'success' && steps.notarize_macos.outcome == 'success' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm i -g npm@12

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: ${{ github.event_name == 'release' || inputs.skip_macos_signing != true }}
        with:
          python-version: "3.11"

      # cryptography loads the OpenSSL 3 / PBES2 .p12 Windows exports and
      # re-writes PBESv1 SHA1+3DES so macOS `security import` succeeds.
      # Pin matches pyproject.toml (CI-only pip must be ==exact).
      - name: Install macOS signing Python deps
        if: ${{ github.event_name == 'release' || inputs.skip_macos_signing != true }}
        run: python3 -m pip install --disable-pip-version-check --no-input 'cryptography==50.0.0'

      - name: Prepare Developer ID certificate
        id: prepare_macos
        if: ${{ github.event_name == 'release' || inputs.skip_macos_signing != true }}
        env:
          CSC_P12_BASE64: ${{ secrets.CSC_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: python3 scripts/ci/prepare_macos_signing.py --require --import-keychain

      - name: Warn unsigned macOS installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_macos_signing == true }}
        run: echo "::warning::Work4You.dmg will be UNSIGNED. Do not ship this artifact."

      # Cursor-model payload: CPython + venv + allowlist + Node + rg, relocated
      # and probed before electron-builder copies it into extraResources.
      # macos-latest is typically arm64 → runtime-darwin-arm64.zip.
      - name: Build prebuilt macOS runtime
        run: |
          set -euo pipefail
          mkdir -p dist
          arch="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "$arch" in
            arm64|aarch64) zip_name=runtime-darwin-arm64.zip ;;
            *) zip_name=runtime-darwin-x64.zip ;;
          esac
          bash scripts/build-desktop-runtime.sh \
            --out-dir apps/desktop/build/runtime \
            --zip-out "$(pwd)/dist/${zip_name}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-runtime
          path: dist/runtime-darwin-*.zip
          if-no-files-found: error

      # apps/desktop `dist:mac:dmg` (`npm run build && npm run builder -- --mac dmg`).
      # `--publish never` is the same flag `npm run pack` already uses so
      # electron-builder 26 does not infer onTagOrDraft from CI + GITHUB_TOKEN
      # (#87758) and race the Work4You.dmg upload below.
      # CSC_NAME / CSC_KEYCHAIN come from GITHUB_ENV after keychain import.
      # Never set CSC_LINK / CSC_KEY_PASSWORD here — CSC_LINK makes
      # electron-builder rebuild a temp keychain (run 35235301249).
      # Do not pass APPLE_* here. electron-builder 26 auto-runs
      # @electron/notarize when APPLE_API_KEY is set (run 35248432787),
      # and afterSign `notarytool --wait` with no timeout hung 88 minutes
      # after a successful Developer ID sign (run 35249919145, killed
      # pid 38554). `mac.notarize` is false; afterSign no-ops via
      # WORK4YOU_SKIP_AFTERSIGN_NOTARIZE; the DMG step notarizes.
      - name: Build macOS DMG installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.prepare_macos.outcome == 'success' && 'true' || 'false' }}
          CSC_NAME: ${{ steps.prepare_macos.outcome == 'success' && steps.prepare_macos.outputs.identity || '' }}
          WORK4YOU_SKIP_AFTERSIGN_NOTARIZE: "1"
        run: npm run build && npm run builder -- --mac dmg --publish never

      - name: Stage macOS artifact
        run: |
          set -euo pipefail
          release='apps/desktop/release'
          if [ ! -d "$release" ]; then
            echo "::error::apps/desktop/release not found"
            exit 1
          fi
          # Same idea as apps/desktop/scripts/test-desktop.mjs resolveDmgPath().
          dmg="$(ls -t "$release"/Work4You-*.dmg 2>/dev/null | head -n 1 || true)"
          if [ -z "$dmg" ]; then
            echo "::error::macOS DMG not found under apps/desktop/release"
            find "$release" -print
            exit 1
          fi
          mkdir -p dist
          cp "$dmg" dist/Work4You.dmg
          ls -lh dist/Work4You.dmg

      - name: Verify Developer ID signature
        id: verify_macos
        if: ${{ steps.prepare_macos.outcome == 'success' }}
        run: |
          set -euo pipefail
          app="$(python3 scripts/ci/prepare_macos_signing.py --print-app apps/desktop/release)"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | python3 scripts/ci/prepare_macos_signing.py --check-codesign-dv

      # Run 35261884765: submit --wait --timeout 1200 uploaded the DMG
      # (id 3b7b6623-b2c4-4f6b-8ee6-ed71db5b7c42) then Apple was still
      # In Progress at 20 minutes. Submit first, log the id, wait 60 minutes.
      - name: Notarize and staple DMG
        id: notarize_macos
        if: ${{ steps.prepare_macos.outcome == 'success' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/desktop/scripts/notarize-artifact.mjs dist/Work4You.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_macos_signing == true && 'macos-installer-unsigned' || 'macos-installer' }}
          path: dist/Work4You.dmg
          if-no-files-found: error

  publish:
    # Never publish when Windows or macOS signing was skipped or did not
    # succeed. Unsigned Work4You-Setup.exe / Work4You.dmg must not clobber
    # desktop-v* assets.
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v') || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && needs.build-windows.outputs.windows_signed == 'true' && needs.build-macos.outputs.macos_signed == 'true'
    name: Publish desktop release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: installers

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            python scripts/ci/resolve_desktop_release_tag.py \
              --event release \
              --release-tag "${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name || true)"
          latest_assets="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.assets[].name' || true)"
          tags="$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' || true)"
          input_tag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            input_tag="${{ inputs.tag }}"
          fi
          python scripts/ci/resolve_desktop_release_tag.py \
            --event workflow_dispatch \
            --input-tag "$input_tag" \
            --github-latest "$latest" \
            --desktop-tags "$tags" \
            --latest-assets "$latest_assets" >> "$GITHUB_OUTPUT"

      # Run 35266198169: signed/notarized installers, then
      # `gh release upload` of Work4You-Setup.exe hit HTTP 500 and left
      # desktop-v0.0.71 as Latest with zero assets. Draft until both files
      # land; retry 5xx/403; rebuild Latest in place when it is hollow.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          extra=()
          if [ -f installers/windows-runtime/runtime-win-x64.zip ]; then
            extra+=(--runtime-zip installers/windows-runtime/runtime-win-x64.zip)
          fi
          for zip in installers/macos-runtime/runtime-darwin-*.zip; do
            if [ -f "$zip" ]; then
              extra+=(--runtime-zip "$zip")
            fi
          done
          python scripts/ci/publish_desktop_release.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --exe installers/windows-installer/Work4You-Setup.exe \
            --dmg installers/macos-installer/Work4You.dmg \
            "${extra[@]}"
