# Golden image source for Work4You Cloud agent VMs.
# Per-tenant apps (`w4y-agent-*`) pull registry.fly.io/work4you-cloud-runtime:…
#
# Deploy (requires org FLY_API_TOKEN — run locally):
#   cd services/work4you-cloud-agent
#   fly deploy -a work4you-cloud-runtime --remote-only
#
# After deploy, note the registry tag (deployment-…) for NAS stage 3.
# Do NOT point customer VMs at the new tag until NAS provision injects the
# full OAuth/bootstrap env contract (stage 2).
app = "work4you-cloud-runtime"
primary_region = "gru"

[build]
  dockerfile = "../../Dockerfile"
  build-context = "../.."

[env]
  WORK4YOU_DASHBOARD_HOST = "0.0.0.0"
  WORK4YOU_DASHBOARD_PORT = "8080"
  PORT = "8080"

# Fly Machines owns PID 1 — entrypoint-dispatch.sh runs stage2-hook + main-wrapper.
# Process command is passed to the image ENTRYPOINT (not a shell); main-wrapper
# routes it to `work4you dashboard …` per docker/entrypoint-dispatch.sh contract.
[processes]
  app = "dashboard --host 0.0.0.0 --port 8080 --no-open"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
