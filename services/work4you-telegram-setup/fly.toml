# Work4You Telegram setup — creates a person's bot with Telegram Managed Bots.
# Custom domain: setup.work4you.ai → this app (the Work4You app's default
# TELEGRAM_ONBOARDING_URL).
app = "work4you-telegram-setup"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# Pairings live in this process's memory, and Telegram hands each manager-bot
# update to a single poller, so this app runs exactly one machine, always on:
# deploy with --ha=false.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
