name: nemo_relay
version: "0.1.0"
description: "Optional NeMo Relay observability for Work4You. Opt in with `work4you plugins enable observability/nemo_relay`; WORK4YOU_NEMO_RELAY_* env vars configure exports after the plugin is enabled."
author: Work4You
hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
